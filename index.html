<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrediULEP - Portal Financiero Seguro</title>
    <meta name="description" content="Plataforma financiera segura con autenticación 2FA por cédula, consulta de crédito disponible y protección criptográfica de datos." />
    <meta property="og:title" content="CrediULEP - Portal Financiero Seguro" />
    <meta property="og:description" content="Plataforma financiera segura con autenticación 2FA por cédula, consulta de crédito disponible y protección criptográfica de datos." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="assets/aistudio/52878_14fa00e9.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <script>
      // Detección automática inteligente para GitHub Pages:
      // Solo redirige a /docs/ si se está sirviendo el index.html fuente sin compilar (/src/main.tsx).
      window.addEventListener('DOMContentLoaded', function() {
        var isUncompiledSource = !!document.querySelector('script[src="/src/main.tsx"]');
        if (!isUncompiledSource) return;
        setTimeout(function() {
          var root = document.getElementById('root');
          var isGitHub = window.location.hostname.includes('github.io');
          if (isGitHub && (!root || root.children.length === 0) && !window.location.pathname.includes('/docs/')) {
            var path = window.location.pathname;
            var repo = path.endsWith('/') ? path : path + '/';
            window.location.replace(repo + 'docs/' + window.location.search + window.location.hash);
          }
        }, 400);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
