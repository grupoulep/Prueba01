    <script>
      // Detección automática inteligente para GitHub Pages:
      // Si la página se publicó desde la raíz (/) y el bundle no compilado no pudo ejecutarse,
      // redirige automáticamente a la carpeta compilada /docs/ sin pantalla en blanco.
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          var isGitHub = window.location.hostname.includes('github.io');
          if (isGitHub && (!root || root.children.length === 0) && !window.location.pathname.includes('/docs/')) {
            var path = window.location.pathname;
            var repo = path.endsWith('/') ? path : path + '/';
            window.location.replace(repo + 'docs/' + window.location.search + window.location.hash);
          }
        }, 300);
      });
    </script>
